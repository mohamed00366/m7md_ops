# =============================================================================
# 🚀 M7 Nexus — Auto-deploy web to GitHub Pages on push to main
# =============================================================================
# SETUP (one-time):
#   1. Push the repo to GitHub
#   2. Go to: Settings → Pages
#   3. Source: "GitHub Actions"
#   4. Push to main → this workflow runs automatically
#
# Result: the site will be live at:
#   https://<your-username>.github.io/<repo-name>/
# =============================================================================
name: Build and Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from Actions tab

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # 1) Build the app
  # ==========================================================================
  build:
    name: 🔨 Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 🔒 إصدار مُثَبَّت لِيُطابِق التَطوير المَحَلِّيّ (intl 0.19)
          # عِندَ الانتِقال لِـ Flutter 3.27+ غَيِّر إلى channel: stable + intl: ^0.20.2
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: ✅ Flutter version
        run: flutter --version

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze (non-blocking)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: 🏗️ Build Web (release)
        # base-href must match the repo name (required for GitHub Pages)
        run: |
          flutter build web \
            --release \
            --base-href="/${{ github.event.repository.name }}/" \
            --pwa-strategy=offline-first

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ==========================================================================
  # 2) Deploy to GitHub Pages
  # ==========================================================================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌍 Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📨 Success summary
        if: success()
        run: |
          echo "::notice::✅ Deployed to ${{ steps.deployment.outputs.page_url }}"
