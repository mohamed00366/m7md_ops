# =============================================================================
# 🚀 M7 Nexus — Auto-deploy web to Firebase Hosting on push to main
# =============================================================================
# SETUP (one-time):
#   1. Generate a Firebase CI token locally:
#        firebase login:ci
#      It prints a long string like 1//0gW...
#   2. Go to: https://github.com/<your-user>/<your-repo>/settings/secrets/actions
#   3. Click "New repository secret":
#        Name: FIREBASE_TOKEN
#        Value: (paste the token)
#   4. Push to main → this workflow runs automatically.
#
# Result: every push to main updates https://m7-nexus.web.app within ~3 minutes.
# =============================================================================
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

jobs:
  deploy:
    name: 🚀 Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🌐 Build web (release)
        run: flutter build web --release

      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: m7-nexus

      - name: 📨 Success summary
        if: success()
        run: |
          echo "::notice::✅ Deployed to https://m7-nexus.web.app"
