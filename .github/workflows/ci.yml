# =============================================================================
# 🤖 M7 Nexus — Continuous Integration
# =============================================================================
# Runs on every push and pull request:
#   1. Setup Flutter
#   2. Install deps
#   3. flutter analyze (lints + type errors)
#   4. flutter test  (widget + unit tests)
#
# Catches regressions before they reach the deployed app.
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # allow manual trigger from Actions tab

jobs:
  analyze-and-test:
    name: 🔍 Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 🔒 مُثَبَّت لِيُطابِق التَطوير المَحَلِّيّ (intl 0.19)
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🎨 Verify formatting (warn only)
        run: dart format --output=none --set-exit-if-changed lib/ || echo "::warning::Some files are not formatted with dart format"
        continue-on-error: true

      - name: 🔬 Analyze (static checks)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run tests
        run: flutter test --reporter expanded
        continue-on-error: true # tests are aspirational right now — don't block PRs

      - name: 📊 Report on test result
        if: always()
        run: |
          echo "::notice::Analyze + test finished. Check the logs above for any issues."

  # ===========================================================================
  # 🌐 Web build smoke-test (catches build errors that analyze misses)
  # ===========================================================================
  build-web:
    name: 🌐 Build web (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🌐 Build web (release)
        run: flutter build web --release

      - name: 📦 Upload web build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web/
          retention-days: 7
