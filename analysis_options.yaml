include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # مَشروع فَرعيّ مُنفَصِل (لَه pubspec.yaml خاصّ بِه)
    - worker_flutter/**
    # مُجَلَّدات مُولَّدة وَ Build
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/.dart_tool/**"
  errors:
    # نَتَجاوَز هذِه الأَخطاء مُؤَقَّتاً لِأَنّها مِن تَغيير API في حُزَم خارِجيّة
    # (geolocator + flutter_foreground_task) — تَحتاج تَحديث في الكود لاحِقاً
    undefined_named_parameter: warning
    invalid_override: warning
    # تَجاهُل invalid_use_of_protected_member في الكود
    invalid_use_of_protected_member: ignore
    invalid_use_of_visible_for_testing_member: ignore
    invalid_use_of_internal_member: ignore

linter:
  rules:
    avoid_print: false
    prefer_const_constructors: true
